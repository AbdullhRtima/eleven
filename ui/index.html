<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eleven · live</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' fill='white' text-anchor='middle'%3E11%3C/text%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f8fafc; --panel: #ffffff; --panel-2: #f1f5f9; --border: #e2e8f0;
  --text: #0f172a; --muted: #64748b; --accent: #6366f1; --accent-soft: #eef2ff;
  --ok: #059669; --ok-soft: #ecfdf5; --warn: #d97706; --warn-soft: #fffbeb;
  --bad: #dc2626; --bad-soft: #fef2f2; --code: #f1f5f9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1020; --panel: #111827; --panel-2: #1a2235; --border: #263042;
    --text: #e5e7eb; --muted: #94a3b8; --accent: #818cf8; --accent-soft: #1e1b4b;
    --ok: #34d399; --ok-soft: #052e22; --warn: #fbbf24; --warn-soft: #2a1d05;
    --bad: #f87171; --bad-soft: #2a0f12; --code: #1a2235;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1020; --panel: #111827; --panel-2: #1a2235; --border: #263042;
  --text: #e5e7eb; --muted: #94a3b8; --accent: #818cf8; --accent-soft: #1e1b4b;
  --ok: #34d399; --ok-soft: #052e22; --warn: #fbbf24; --warn-soft: #2a1d05;
  --bad: #f87171; --bad-soft: #2a0f12; --code: #1a2235;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 6px 12px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button:hover { filter: brightness(1.05); }
a { color: var(--accent); }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 2; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: -.02em; font-size: 16px; }
.logo i { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #fff; font-style: normal; font-size: 12px; }
.proj { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { flex: 1; }
.live { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr) 300px; min-height: calc(100vh - 51px); }
aside, .feed { border-right: 1px solid var(--border); background: var(--panel); padding: 12px; overflow: auto; }
.feed { border-right: 0; border-left: 1px solid var(--border); }
aside h3, .feed h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 4px 6px; }
.nav { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; margin-bottom: 2px; }
.nav:hover { background: var(--panel-2); }
.nav.sel { background: var(--accent-soft); }
.nav b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main { padding: 20px 24px; overflow: auto; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.run { background: var(--accent-soft); color: var(--accent); }

.title { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 4px; }
.title h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 0 0 16px; }
.callout { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
.callout b { color: var(--warn); }
.callout ul { margin: 6px 0 0; padding-left: 18px; }

.steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 16px; }
.step { padding: 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); font-size: 12px; color: var(--muted); text-align: center; }
.step.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
.step.now { color: #fff; background: var(--accent); border-color: var(--accent); font-weight: 600; }

.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.card small { color: var(--muted); display: block; margin-bottom: 4px; }
.card strong { font-size: 18px; }
.meter { height: 6px; border-radius: 3px; background: var(--panel-2); margin-top: 8px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); }
.meter span.warn { background: var(--warn); } .meter span.bad { background: var(--bad); }

table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--panel-2); }
tr:last-child td { border-bottom: 0; }
tr.next td { background: var(--accent-soft); }
.tablewrap { overflow-x: auto; margin-bottom: 16px; }
.role { font-weight: 600; white-space: nowrap; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; overflow-x: auto; }
.tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 8px 12px; white-space: nowrap; }
.tab.sel { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.doc { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 4px 20px; overflow-x: auto; }
.doc pre, .doc code { background: var(--code); border-radius: 6px; font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12.5px; }
.doc pre { padding: 10px; overflow-x: auto; } .doc code { padding: 1px 4px; } .doc pre code { padding: 0; }
.doc table { margin: 8px 0; }
.report { margin-bottom: 12px; }
.report summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 8px; align-items: center; list-style: none; }
.report summary::-webkit-details-marker { display: none; }
.report[open] summary { border-bottom: 1px solid var(--border); }

.ev { padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.ev time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }
.ev.new { animation: flash 2s; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.muted { color: var(--muted); }

.empty { max-width: 640px; margin: 10vh auto; padding: 0 16px; text-align: center; }
.empty h1 { font-size: 30px; letter-spacing: -.02em; margin-bottom: 8px; }
.empty p { color: var(--muted); }
.empty .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 20px 0; }
.empty ol { text-align: left; display: inline-block; color: var(--muted); }

@media (max-width: 1100px) { .layout { grid-template-columns: 220px minmax(0, 1fr); } .feed { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--border); } }
@media (max-width: 720px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  header { gap: 8px; }
  .sub, .callout li, .doc { overflow-wrap: anywhere; }
  aside { border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 16px; }
  .steps { grid-template-columns: repeat(3, 1fr); }
  .cards { grid-template-columns: 1fr; }
  .proj { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="logo"><i>11</i>eleven</div>
  <div class="proj" id="proj"></div>
  <div class="spacer"></div>
  <div class="live" id="live"><span class="dot"></span><span>not connected</span></div>
  <button id="themeBtn" title="Toggle theme">◐</button>
  <button class="primary" id="openBtn">Open folder</button>
</header>
<div id="app"></div>
<input type="file" id="dirInput" webkitdirectory multiple hidden>

<script>
// eleven live: reads an eleven/ folder in the browser. Nothing is uploaded anywhere.
const POLL_MS = 2000;
const CAPS = { "plan.md": 4000, "notes.md": 8000 };
const STEPS = ["Intake", "Plan", "Explore", "Execute", "Verify", "Ship"];

const state = { root: null, files: new Map(), mtimes: new Map(), events: [], view: { item: null, tab: "brief" }, live: false, sig: "" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function md(text) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text || ""));
  return `<pre>${esc(text)}</pre>`;
}

// ---------- reading the folder ----------
async function walk(dir, prefix, out) {
  for await (const [name, handle] of dir.entries()) {
    if (name.startsWith(".")) continue;
    const path = prefix + name;
    if (handle.kind === "directory") {
      if (["agents", "templates", "docs", "ui"].includes(name) && !prefix) continue;
      await walk(handle, path + "/", out);
    } else if (name.endsWith(".md")) {
      out.push([path, handle]);
    }
  }
}

async function readFromHandle() {
  const entries = [];
  await walk(state.root, "", entries);
  const files = new Map(), mtimes = new Map();
  for (const [path, h] of entries) {
    const f = await h.getFile();
    mtimes.set(path, f.lastModified);
    files.set(path, state.mtimes.get(path) === f.lastModified ? state.files.get(path) : await f.text());
  }
  return { files, mtimes };
}

async function readFromInput(fileList) {
  const files = new Map(), mtimes = new Map();
  for (const f of fileList) {
    const parts = f.webkitRelativePath.split("/").slice(1);
    const path = parts.join("/");
    if (!path.endsWith(".md") || ["agents", "templates", "docs", "ui"].includes(parts[0])) continue;
    files.set(path, await f.text());
    mtimes.set(path, f.lastModified);
  }
  return { files, mtimes };
}

function diffEvents(next) {
  if (!state.files.size) return;
  const now = new Date();
  for (const [path, m] of next.mtimes) {
    if (!state.mtimes.has(path)) pushEvent(now, path, "created");
    else if (state.mtimes.get(path) !== m) pushEvent(now, path, "updated");
  }
  for (const path of state.mtimes.keys()) if (!next.mtimes.has(path)) pushEvent(now, path, "removed");
}

function pushEvent(time, path, verb) {
  state.events.unshift({ time, path, verb, fresh: true });
  state.events.length = Math.min(state.events.length, 200);
}

async function refresh() {
  try {
    const next = await readFromHandle();
    diffEvents(next);
    state.files = next.files; state.mtimes = next.mtimes;
    const sig = [...next.mtimes].map(([p, m]) => p + m).join("|");
    if (sig !== state.sig) { state.sig = sig; render(); }
    setLive(true);
  } catch (e) {
    setLive(false, "lost access, reopen the folder");
  }
}

function setLive(on, msg) {
  state.live = on;
  $("#live").innerHTML = `<span class="dot ${on ? "on" : ""}"></span><span>${esc(msg || (on ? "live" : "snapshot"))}</span>`;
}

// ---------- parsing the ledger ----------
function section(text, heading) {
  const re = new RegExp(`^##\\s+${heading}[^\\n]*\\n([\\s\\S]*?)(?=^##\\s|$(?![\\s\\S]))`, "mi");
  const m = (text || "").match(re);
  return m ? m[1].trim() : "";
}

function bullets(text) {
  return text.split("\n").map((l) => l.replace(/^\s*[-*]\s*(\[.\]\s*)?/, "").trim())
    .filter((l) => l && !/^<.*>$/.test(l) && !l.startsWith("<!--"));
}

function parseTable(text) {
  const rows = (text || "").split("\n").filter((l) => l.trim().startsWith("|"));
  if (rows.length < 2) return [];
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const head = cells(rows[0]).map((h) => h.toLowerCase());
  return rows.slice(2).map(cells).filter((r) => r.some(Boolean))
    .map((r) => Object.fromEntries(head.map((h, i) => [h, r[i] || ""])));
}

function parseItem(id) {
  const get = (f) => state.files.get(`work/${id}/${f}`);
  const brief = get("brief.md"), plan = get("plan.md"), notes = get("notes.md"), tasksMd = get("tasks.md");
  const tasks = parseTable(tasksMd).filter((t) => t.task);
  const round = (tasksMd || "").match(/Round:\s*(\d+)\s*\/\s*(\d+)/i);
  const reports = [...state.files.keys()].filter((p) => p.startsWith(`work/${id}/reports/`)).sort()
    .map((p) => {
      const text = state.files.get(p);
      return { path: p, name: p.split("/").pop().replace(/\.md$/, ""), text,
        result: (section(text, "Result").split("\n")[0] || "").toLowerCase(),
        questions: bullets(section(text, "Open questions")) };
    });
  const title = (brief || "").match(/^#\s*Brief:\s*(.+)$/m)?.[1]?.trim();
  const status = (brief || "").match(/^Status:\s*(.+)$/m)?.[1] || "";
  const approved = /approved/i.test(status) && !/draft\s*\|/i.test(status);
  const questions = [...bullets(section(brief, "Open questions")), ...reports.flatMap((r) => r.questions.map((q) => `${q} (${r.name})`))];
  const next = tasks.find((t) => /next/i.test(t.status));
  const isDone = (t) => /done|pass|✓|✅/i.test(t.status);
  const allDone = tasks.length > 0 && tasks.every(isDone);
  const qaFailed = reports.length && /qa/i.test(reports.at(-1).name) && /fail/.test(reports.at(-1).result);
  const r = round ? { n: +round[1], max: +round[2] } : { n: 0, max: 10 };

  let step = 0, phase = { label: "Intake", kind: "" };
  if (!brief) phase = { label: "Intake", kind: "" };
  else if (!approved) phase = { label: "Brief awaiting your approval", kind: "warn" };
  else if (!plan) { step = 1; phase = { label: "Planning", kind: "run" }; }
  else if (allDone) { step = 5; phase = { label: "Ready to ship", kind: "ok" }; }
  else if (next) {
    step = /explore/i.test(next.task) ? 2 : /qa/i.test(next.role) ? 4 : 3;
    phase = { label: `${next.role || "?"}: ${next.task}`, kind: "run" };
  } else { step = 3; phase = { label: "Waiting for the CTO", kind: "" }; }
  if (r.n >= r.max) phase = { label: "Round budget reached", kind: "bad" };
  if (qaFailed && step !== 5) phase = { label: "QA failed: back to the CTO", kind: "bad" };
  if (questions.length) phase = { label: "Needs you", kind: "warn" };

  return { id, title: title || id, status, brief, plan, notes, tasksMd, tasks, reports, questions, round: r, step, phase, allDone };
}

function items() {
  const ids = new Set();
  for (const p of state.files.keys()) { const m = p.match(/^work\/([^/]+)\//); if (m) ids.add(m[1]); }
  return [...ids].sort().map(parseItem);
}

// ---------- rendering ----------
const ROLE_HUES = { cto: 245, product: 200, designer: 320, architect: 270, backend: 160, frontend: 190, mobile: 30, qa: 0, devops: 90, security: 350, writer: 50 };
function roleTag(role) {
  const key = (role || "").toLowerCase().split(/[\s/]/)[0];
  const h = ROLE_HUES[key] ?? 220;
  return `<span class="role" style="color:hsl(${h} 65% 55%)">${esc(role)}</span>`;
}

function render() {
  if (!state.files.size && !state.root) return renderEmpty();
  const list = items();
  const projectTitle = (state.files.get("project.md") || "").match(/^#\s*Project:\s*(.+)$/m)?.[1];
  $("#proj").textContent = projectTitle && !projectTitle.startsWith("<") ? projectTitle : (state.rootName || "");
  if (!state.view.item || (state.view.item.startsWith("work:") && !list.find((i) => "work:" + i.id === state.view.item)))
    state.view.item = list.length ? "work:" + list.at(-1).id : "project";

  const decisions = [...state.files.keys()].filter((p) => p.startsWith("decisions/")).sort();
  $("#app").innerHTML = `<div class="layout">
    <aside>
      <h3>Items</h3>
      ${list.map((i) => `<button class="nav ${state.view.item === "work:" + i.id ? "sel" : ""}" data-item="work:${esc(i.id)}">
        <b>${esc(i.id)}</b><span class="badge ${i.phase.kind}">${esc(short(i.phase.label, 30))}</span></button>`).join("") || `<p class="muted" style="padding:0 10px">No items yet. Ask the CTO to start one.</p>`}
      <h3>Project</h3>
      <button class="nav ${state.view.item === "project" ? "sel" : ""}" data-item="project"><b>project.md</b></button>
      ${decisions.length ? `<h3>Decisions</h3>` + decisions.map((d) => `<button class="nav ${state.view.item === "file:" + d ? "sel" : ""}" data-item="file:${esc(d)}"><b>${esc(d.slice(10).replace(/\.md$/, ""))}</b></button>`).join("") : ""}
    </aside>
    <main>${renderMain(list)}</main>
    <section class="feed"><h3>Activity</h3>${renderFeed()}</section>
  </div>`;
  document.querySelectorAll("[data-item]").forEach((b) => b.onclick = () => { state.view.item = b.dataset.item; state.view.tab = "brief"; render(); });
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { state.view.tab = b.dataset.tab; render(); });
  state.events.forEach((e) => e.fresh = false);
}

function short(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }

function renderMain(list) {
  const v = state.view.item;
  if (v === "project") return `<div class="title"><h1>Project</h1></div><p class="sub">eleven/project.md: facts every agent reads first</p><div class="doc">${md(state.files.get("project.md") || "_No project.md yet._")}</div>`;
  if (v.startsWith("file:")) return `<div class="doc">${md(state.files.get(v.slice(5)))}</div>`;
  const i = list.find((x) => "work:" + x.id === v);
  if (!i) return "";

  const capCard = (name, text) => {
    const len = (text || "").length, cap = CAPS[name], pct = Math.min(100, (len / cap) * 100);
    return `<div class="card"><small>${name} size</small><strong>${len.toLocaleString()}</strong> <span class="muted">/ ${cap.toLocaleString()}</span>
      <div class="meter"><span class="${pct >= 100 ? "bad" : pct > 85 ? "warn" : ""}" style="width:${pct}%"></span></div></div>`;
  };
  const roundPct = Math.min(100, (i.round.n / i.round.max) * 100);
  const tab = state.view.tab;
  const tabs = [["brief", "Brief"], ["plan", "Plan"], ["notes", "Notes"], ["reports", `Reports (${i.reports.length})`], ["tasks", "tasks.md"]];
  let body = "";
  if (tab === "reports") {
    body = i.reports.length ? i.reports.slice().reverse().map((r, n) => `<details class="report doc" ${n === 0 ? "open" : ""} style="padding:0">
      <summary><b>${esc(r.name)}</b>${resultBadge(r.result)}</summary><div style="padding:0 16px">${md(r.text)}</div></details>`).join("")
      : `<p class="muted">No reports yet.</p>`;
  } else {
    const src = { brief: i.brief, plan: i.plan, notes: i.notes, tasks: i.tasksMd }[tab];
    body = `<div class="doc">${src ? md(src) : `<p class="muted">Not written yet.</p>`}</div>`;
  }

  return `
    <div class="title"><h1>${esc(i.title)}</h1><span class="badge ${i.phase.kind}">${esc(i.phase.label)}</span></div>
    <p class="sub">work/${esc(i.id)} · ${esc(i.status || "no brief yet")}</p>
    ${i.questions.length ? `<div class="callout"><b>Needs your answer</b><ul>${i.questions.map((q) => `<li>${esc(q)}</li>`).join("")}</ul></div>` : ""}
    <div class="steps">${STEPS.map((s, n) => `<div class="step ${n < i.step || (i.allDone && n === 5) ? "done" : n === i.step ? "now" : ""}">${s}</div>`).join("")}</div>
    <div class="cards">
      <div class="card"><small>Round</small><strong>${i.round.n}</strong> <span class="muted">/ ${i.round.max}</span>
        <div class="meter"><span class="${roundPct >= 100 ? "bad" : roundPct >= 80 ? "warn" : ""}" style="width:${roundPct}%"></span></div></div>
      ${capCard("plan.md", i.plan)}${capCard("notes.md", i.notes)}
    </div>
    ${i.tasks.length ? `<div class="tablewrap"><table><thead><tr><th>#</th><th>Task</th><th>Role</th><th>Done when</th><th>Status</th></tr></thead><tbody>
      ${i.tasks.map((t) => `<tr class="${/next/i.test(t.status) ? "next" : ""}"><td>${esc(t["#"])}</td><td>${esc(t.task)}</td><td>${roleTag(t.role)}</td><td class="muted">${esc(t["done condition"] || t["done when"] || "")}</td><td>${statusBadge(t.status)}</td></tr>`).join("")}
    </tbody></table></div>` : ""}
    <div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${tab === k ? "sel" : ""}" data-tab="${k}">${l}</button>`).join("")}</div>
    ${body}`;
}

function statusBadge(s) {
  const k = /next/i.test(s) ? "run" : /done|pass/i.test(s) ? "ok" : /fail|block/i.test(s) ? "bad" : "";
  return `<span class="badge ${k}">${esc(s || "todo")}</span>`;
}
function resultBadge(r) {
  if (!r) return "";
  const k = /^done|pass/.test(r) ? "ok" : /fail|block/.test(r) ? "bad" : "warn";
  return `<span class="badge ${k}">${esc(r)}</span>`;
}

function renderFeed() {
  if (!state.events.length) return `<p class="muted" style="padding:0 6px">${state.live ? "Watching for changes. Edits by your agents show up here." : "Live updates need Chrome or Edge."}</p>`;
  return state.events.map((e) => `<div class="ev ${e.fresh ? "new" : ""}"><time>${e.time.toLocaleTimeString()}</time>${esc(describe(e))}</div>`).join("");
}

function describe(e) {
  const m = e.path.match(/^work\/([^/]+)\/(?:reports\/(.+)\.md|(.+))$/);
  if (!m) return `${e.path} ${e.verb}`;
  if (m[2]) return `${m[1]}: report ${m[2]} ${e.verb === "created" ? "filed" : e.verb}`;
  return `${m[1]}: ${m[3]} ${e.verb}`;
}

function renderEmpty() {
  const fsa = "showDirectoryPicker" in window;
  $("#app").innerHTML = `<div class="empty">
    <h1>Watch your AI team work.</h1>
    <p>Open the <b>eleven</b> folder inside your project. This page reads the ledger (briefs, plans, tasks, reports) and updates live as your agents write. Your files never leave this computer.</p>
    <div class="btns"><button class="primary" id="openBtn2">Open eleven folder</button>${state.saved ? `<button id="reconnect">Reconnect to ${esc(state.saved.name)}</button>` : ""}</div>
    ${fsa ? "" : `<p><span class="badge warn">Snapshot mode</span> This browser can't watch folders. Use Chrome or Edge for live updates.</p>`}
    <ol><li>Install: <code>install.sh</code> (macOS/Linux) or <code>install.ps1</code> (Windows)</li><li>Tell your agent: <i>Read eleven/AGENTS.md and act as the CTO…</i></li><li>Open the folder here and watch.</li></ol>
  </div>`;
  $("#openBtn2").onclick = openFolder;
  if ($("#reconnect")) $("#reconnect").onclick = reconnect;
}

// ---------- folder access ----------
const idb = () => new Promise((res, rej) => { const r = indexedDB.open("eleven-live", 1); r.onupgradeneeded = () => r.result.createObjectStore("h"); r.onsuccess = () => res(r.result); r.onerror = rej; });
async function saveHandle(h) { try { const db = await idb(); db.transaction("h", "readwrite").objectStore("h").put(h, "root"); } catch {} }
async function loadHandle() { try { const db = await idb(); return await new Promise((res) => { const q = db.transaction("h").objectStore("h").get("root"); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch { return null; } }

async function connect(handle) {
  state.root = handle; state.rootName = handle.name; state.files = new Map(); state.mtimes = new Map(); state.events = []; state.sig = ""; state.view.item = null;
  await refresh();
  clearInterval(state.timer);
  state.timer = setInterval(refresh, POLL_MS);
}

async function openFolder() {
  if (!("showDirectoryPicker" in window)) return $("#dirInput").click();
  try {
    const h = await window.showDirectoryPicker({ id: "eleven", mode: "read" });
    saveHandle(h);
    await connect(h);
  } catch (e) { if (e.name !== "AbortError") alert(e.message); }
}

async function reconnect() {
  const h = state.saved;
  if ((await h.requestPermission({ mode: "read" })) === "granted") connect(h);
}

$("#dirInput").onchange = async (e) => {
  const next = await readFromInput(e.target.files);
  state.root = null; state.rootName = e.target.files[0]?.webkitRelativePath.split("/")[0] || "";
  state.files = next.files; state.mtimes = next.mtimes; state.view.item = null;
  setLive(false, "snapshot, reopen to refresh");
  render();
};

$("#openBtn").onclick = openFolder;
$("#themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("eleven-theme", document.documentElement.dataset.theme); } catch {}
};
try { const t = localStorage.getItem("eleven-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}

renderEmpty();
(async () => {
  if (!("showDirectoryPicker" in window)) return;
  state.saved = await loadHandle();
  if (!state.saved || state.root) return;
  if ((await state.saved.queryPermission?.({ mode: "read" })) === "granted") return connect(state.saved);
  renderEmpty();
})();
</script>
</body>
</html>
