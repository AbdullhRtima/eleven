"use strict";

// ---------------------------------------------------------------- markdown

    "label", "output", "datalist", "iframe", "frame", "frameset", "object", "embed", "applet", "portal", "audio", "video", "source",
    "track", "picture", "map", "area", "dialog", "marquee", "image", "use", "feimage", "foreignobject"],

// ---------------------------------------------------------------- ledger rules (notes.md)
/* @ledger-core:start */
const KIT_DIRS = new Set(["agents", "templates", "docs", "ui"]);
const keepFile = (name) => /\.(md|html?)$/i.test(name);
const isMd = (p) => /\.md$/i.test(p);

  const lines = (text || "").split(/\r?\n/);

    if (!head.includes("task") || !head.includes("status") || !/^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) continue;

    for (let j = i + 2; j < lines.length && lines[j].trim().startsWith("|"); j++) {

      const get = (n) => (col(n) >= 0 ? c[col(n)] ?? "" : "");
      const r = { n: get("#"), task: get("task"), role: get("role"), status: get("status"), raw: lines[j] };

function openQuestions(text) {
  const lines = (text || "").split(/\r?\n/);
  let fence = false, on = false;
  const out = [];
  for (const l of lines) {
    if (/^\s*(```|~~~)/.test(l)) fence = !fence;
    if (!fence && /^#{1,2}\s/.test(l)) {
      if (on) break;
      if (/^##\s+Open questions\b/i.test(l)) { on = true; continue; }
    }

  }
  const md = out.join("\n").replace(/<!--[\s\S]*?-->/g, "").trim();
  const empty = !md || /^(-\s*)?none\b/i.test(md) || /^[-*]\s*<[^>]*>$/.test(md);
  const count = empty ? 0 : md.split("\n").filter((l) => /^(\d+[.)]|[-*+])\s/.test(l)).length;
  return { md: empty ? "" : md, count };

function itemModel(id, files) {   // files: Map of ledger path -> { text }
  const t = files.get(`work/${id}/tasks.md`)?.text;
  const b = files.get(`work/${id}/brief.md`)?.text;
  const title = b?.match(/^#\s+Brief:\s*(.+)$/m)?.[1]?.trim() || b?.match(/^#\s+(.+)$/m)?.[1]?.trim() || id.replace(/^\d+-/, "");
  const rm = t?.match(/^Round:\s*(\d+)\s*\/\s*(\d+)/m);

  const rows = t != null ? parseTasks(t) : null;
  const briefStatus = strip(b?.match(/^Status:\s*(.+)$/m)?.[1] ?? "");
  const q = openQuestions(b);
  const it = { id, num: id.match(/^(\d+)/)?.[1] || id, title, round, warn: [], questionsMd: q.md, questionsCount: q.count,
    brief: b != null ? `work/${id}/brief.md` : null, tasks: t != null ? `work/${id}/tasks.md` : null };

    if (b == null) Object.assign(it, { state: "new", chip: "Not started", sentence: "No brief yet." });
    else if (/^approved\b/i.test(briefStatus)) Object.assign(it, { state: "working", chip: "Working · CTO", sentence: "Writing the plan." });
    else Object.assign(it, { state: "waiting", chip: "Waiting on you", sentence: "Read the brief and approve it.", gate: true });
  } else {
    const nexts = rows.filter((r) => statusKind(r.status) === "next");
    const next = nexts[0];
    if (nexts.length > 1) it.warn.push(`${nexts.length} tasks are marked NEXT. Showing the first.`);
    if (next) {
      it.nextTask = next.task; it.nextRole = strip(next.role);
      if (isUserRole(next.role)) {
        let s = next.task.replace(/^\s*(user|ceo)\s*:\s*/i, "");
        s = s.charAt(0).toUpperCase() + s.slice(1);
        Object.assign(it, { state: "waiting", chip: "Waiting on you", sentence: s, md: true });
      } else Object.assign(it, { state: "working", chip: `Working · ${strip(next.role) || "?"}`, sentence: next.task, md: true });
    } else if (rows.every((r) => statusKind(r.status) === "done")) Object.assign(it, { state: "done", chip: "Done", sentence: "All tasks done." });
    else Object.assign(it, { state: "idle", chip: "Waiting for the CTO", sentence: "No task is marked NEXT." });
  }
  if (round && round.n >= round.max && it.state !== "done") it.warn.unshift(`Round limit reached (${round.n} of ${round.max}). The team stops here.`);
  return it;
}

// file type, labels
function fileType(p) {
  if (p === "project.md") return "project";
  if (isHtml(p)) return "html";
  if (p.startsWith("decisions/")) return "decision";
  const m = p.match(/^work\/[^/]+\/(.+)$/);
  if (!m) return "design";
  if (m[1].startsWith("reports/")) return "report";
  if (["brief.md", "plan.md", "notes.md", "tasks.md"].includes(m[1])) return m[1].slice(0, -3);
  return "design";
}
function fileLabel(p) {
  const name = baseName(p), t = fileType(p);
  if (t === "project") return "project";
  if (t === "html") return name;
  const bare = name.replace(/\.md$/i, "");
  if (t === "report" || t === "decision") { const m = bare.match(/^(\d+[a-z]?)-(.+)$/i); if (m) return `${m[1]} · ${m[2]}`; }
  return bare;

// references (notes.md "Edge patterns" 2 and 3): reader links and work-graph outputs
const RE_PATH = /(?<![\p{L}\p{N}_./-])((?:\.\.?\/)*(?:[\p{L}\p{N}\p{M}_.-]+\/)*[\p{L}\p{N}\p{M}_.-]+\.(?:md|html?))(?::\d+(?:[–-]\d+)?)?(?![\p{L}\p{N}_/-])/giu;

  const out = [...String(raw).matchAll(RE_PATH)].map((m) => m[1]);

// ---------------------------------------------------------------- sources
// Security M3: if the picked folder holds eleven/, read (and save) only that sub-folder, never the whole project.
async function fsaRoot(picked) {
  try { const sub = await picked.getDirectoryHandle("eleven"); return { root: sub, name: picked.name }; } catch {}
  return { root: picked, name: picked.name };
}
// root: the eleven folder handle. save: { h, name } to store once the first scan finds a ledger (null = don't save).
function fsaSource(root, name, save = null) {
  return {
    kind: "fsa", handle: root, name, save,
    async scan() {
      const files = new Map(), dirs = new Set();
      let ledger = false;
      const walk = async (dir, prefix) => {
        for await (const [name, h] of dir.entries()) {
          if (name.startsWith(".")) continue;
          const p = prefix + "/" + name;
          if (h.kind === "directory") { dirs.add(p); await walk(h, p); }
          else if (keepFile(name)) {
            const f = await h.getFile();           // metadata only; text is read later, md only
            files.set(p, { mtime: f.lastModified, read: () => f.text(), blob: () => h.getFile() });
          }
        }
      };
      for await (const [name, h] of root.entries()) {
        if (name.startsWith(".")) continue;
        if (h.kind === "directory") {
          if (name === "work" || name === "decisions") { ledger = true; dirs.add(name); await walk(h, name); }
        } else if (name === "project.md") {
          ledger = true;
          const f = await h.getFile();
          files.set(name, { mtime: f.lastModified, read: () => f.text(), blob: () => h.getFile() });
        } else if (name === "AGENTS.md") ledger = true;
      }
      return { files, dirs, ledger };
    },
  };
}
function filterRel(rel) {
  const parts = rel.split("/");
  if (parts.some((s) => s.startsWith("."))) return false;
  if (parts.length === 1) return rel === "project.md";
  if (KIT_DIRS.has(parts[0])) return false;
  return (parts[0] === "work" || parts[0] === "decisions") && keepFile(parts.at(-1));
}
function snapshotSource(fileList) {
  const all = [...fileList];
  const name = all[0]?.webkitRelativePath.split("/")[0] || "";
  const rels = all.map((f) => [f.webkitRelativePath.split("/").slice(1).join("/"), f]);
  const inner = rels.some(([r]) => r.startsWith("eleven/"));
  const files = new Map(), dirs = new Set();
  let ledger = false;
  for (let [rel, f] of rels) {
    if (inner) { if (!rel.startsWith("eleven/")) continue; rel = rel.slice(7); }
    if (/^(work|decisions)\//.test(rel) || rel === "project.md" || rel === "AGENTS.md") ledger = true;
    if (!filterRel(rel)) continue;
    const parts = rel.split("/");
    for (let i = 1; i < parts.length; i++) dirs.add(parts.slice(0, i).join("/"));
    files.set(rel, { mtime: f.lastModified, read: () => f.text(), blob: async () => f });
  }
  return { kind: "snapshot", name, async scan() { return { files, dirs, ledger }; } };
}

// ---------------------------------------------------------------- IndexedDB (folder handle)
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open("eleven-live", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("h");
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
// Stored value: { h: <the eleven folder handle>, name: <project folder name> }. A bare handle is the old format (task 7 and
// before), which could be the whole project: boot() replaces it or drops it.
async function saveHandle(rec) { try { const db = await idb(); db.transaction("h", "readwrite").objectStore("h").put(rec, "root"); } catch {} }

async function loadHandle() {
  try {
    const db = await idb();
    return await new Promise((res) => { const q = db.transaction("h").objectStore("h").get("root"); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); });
  } catch { return null; }
}

// ---------------------------------------------------------------- refresh loop
async function refresh() {
  if (S.busy || !S.source) return;
  S.busy = true;
  const first = S.first;
  let ch = null;
  try {   // only reading the folder can mean "Lost access"; a render error never does (security M4)
    const scan = await S.source.scan();
    if (!scan.ledger) { S.noLedger = true; S.files = new Map(); S.dirs = new Set(); ch = { first: true, changed: new Set(), removed: new Set() }; }
    else {
      S.noLedger = false;
      const changed = new Set(), removed = new Set(), next = new Map();
      for (const [p, e] of scan.files) {
        const old = S.files.get(p);
        if (old && old.mtime === e.mtime) { next.set(p, { ...old, entry: e }); continue; }
        const text = isMd(p) ? await e.read() : null;   // never read .html while polling
        next.set(p, { path: p, mtime: e.mtime, text, entry: e });
        changed.add(p);
      }
      for (const p of S.files.keys()) if (!next.has(p)) removed.add(p);
      const dirsChanged = [...scan.dirs].join("|") !== [...S.dirs].join("|");
      S.files = next; S.dirs = new Set(scan.dirs);
      if (S.status === "paused" || S.status === "reading") setStatus(S.source.kind === "snapshot" ? "snapshot" : "live");
      if (S.source.save) { saveHandle(S.source.save); S.source.save = null; }   // M3: persist only a folder that holds a ledger
      ch = first || changed.size || removed.size || dirsChanged ? { first, changed, removed } : null;
    }
  } catch (e) {
    if (first) { console.error(e); }
    setStatus("paused");
  }

    if (ch) renderAll(ch); else if (S.status !== "paused") tick();
  } catch (e) {
    renderFailed(e);

  }
}

  }
  if (S.view.kind === "file" && S.view.path && S.files.has(S.view.path)) openAncestors(S.view.path);

const ITEM_ORDER = ["brief.md", "tasks.md", "plan.md", "notes.md"];

  for (const p of S.files.keys()) {

  }

  };

      style="padding-left:${8 + (level - 1) * 14}px"${inner.title ? ` title="${esc(inner.title)}"` : ""}><span class="chev">${CHEV}</span>${inner.html}</div>`);
    if (!open) return;

    c.dirs.forEach((x) => dirRow(x, level + 1, { html: `<span class="name" dir="auto">${esc(baseName(x))}</span>` }));
    c.rest.forEach((p) => fileRow(p, level + 1));

    if (G.mode !== "ltr" || e.button > 0) return;
    pts.set(e.pointerId, local(e));
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: G.k, x: G.x, y: G.y, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
      drag = null; return;
    }
    const p = local(e);
    drag = { target: e.target, sx: p.x, sy: p.y, ox: G.x, oy: G.y, moved: false, id: e.pointerId };
  });
  svg.addEventListener("pointermove", (e) => {
    const p = local(e);
    if (pts.has(e.pointerId)) pts.set(e.pointerId, p);
    if (pinch && pts.size === 2) {
      const [a, b] = [...pts.values()];
      const k = Math.max(.3, Math.min(3, pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
      G.x = pinch.cx - (pinch.cx - pinch.x) * (k / pinch.k); G.y = pinch.cy - (pinch.cy - pinch.y) * (k / pinch.k); G.k = k;
      return applyTransform();
    }
    if (!drag) {
      const h = e.target.closest?.("[data-key]")?.dataset.key || null;
      if (h !== G.hover) { G.hover = h; applyFocus(); }
      return;
    }
    if (!drag.moved && Math.hypot(p.x - drag.sx, p.y - drag.sy) > 4) { drag.moved = true; svg.setPointerCapture(drag.id); svg.classList.add("panning"); }
    if (drag.moved) { G.x = drag.ox + p.x - drag.sx; G.y = drag.oy + p.y - drag.sy; applyTransform(); }
  });
  const end = (e) => {
    pts.delete(e.pointerId);
    if (pinch) { if (pts.size < 2) pinch = null; drag = null; return; }
    svg.classList.remove("panning");
    if (drag && !drag.moved && e.type === "pointerup") activate(drag.target);
    drag = null;
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
  svg.addEventListener("click", (e) => { if (G.mode === "td") activate(e.target); });
  svg.addEventListener("pointerleave", () => { if (!drag && G.hover) { G.hover = null; applyFocus(); } });
  svg.addEventListener("wheel", (e) => {
    if (G.mode !== "ltr") return;
    e.preventDefault();
    const p = local(e);
    if (e.ctrlKey || e.metaKey) {
      const k = Math.max(.3, Math.min(3, G.k * Math.exp(-e.deltaY * 0.01)));
      G.x = p.x - (p.x - G.x) * (k / G.k); G.y = p.y - (p.y - G.y) * (k / G.k); G.k = k;
    } else { G.x -= e.deltaX; G.y -= e.deltaY; }
    applyTransform();
  }, { passive: false });
  svg.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const t = e.target.closest?.(".gchev, [data-open]");
    if (t) { e.preventDefault(); activate(t); }
  });
  svg.addEventListener("focusin", (e) => { const k = e.target.closest?.("[data-key]")?.dataset.key; if (k) { G.hover = k; applyFocus(); } });
})();
// B4: refit whenever the graph box changes size (split opens/closes, window resize, legend wraps)
if (window.ResizeObserver) new ResizeObserver(() => {
  if (!S.graphOpen || !S.model) return;
  cancelAnimationFrame(G.raf); G.raf = requestAnimationFrame(() => renderGraph());
}).observe($(".gwrap"));
function openFromGraph(path) { navigate("file", path, { keepGraph: true }); }
function setGraph(on) {
  S.graphOpen = on;
  if (on) { G.fitted = false; G.key = ""; }
  if (isPhone()) setDrawer(false);
  writeHash();
  layoutPanes();
  if (on && S.model) renderGraph();
  updateGraphButtons();
}
function updateGraphButtons() { for (const b of [$("#graphBtn"), $("#graphBtnPhone")]) b.setAttribute("aria-pressed", String(S.graphOpen)); }
$("#graphBtn").onclick = () => setGraph(!S.graphOpen);
$("#graphBtnPhone").onclick = () => setGraph(!S.graphOpen);
$("#gClose").onclick = () => setGraph(false);
$("#gFit").onclick = fitGraph;

// ---------------------------------------------------------------- top bar, drawer, theme, keys
function setDrawer(on) {
  document.body.classList.toggle("drawer", on);
  $("#menuBtn").setAttribute("aria-expanded", String(on));
  $("#menuBtn").setAttribute("aria-label", on ? "Close files" : "Open files");
  if (on) ($("#tree .row.sel") || $("#tree .row"))?.focus();
}
$("#menuBtn").onclick = () => setDrawer(!document.body.classList.contains("drawer"));
$("#closeSide").onclick = () => setDrawer(false);
$("#scrim").onclick = () => setDrawer(false);
$("#logoBtn").onclick = () => { if (S.source) navigate("home", null, { closeGraph: true }); };
function closeMenus() { $("#folderMenu").hidden = true; $("#pillMenu").hidden = true; $("#folderBtn").setAttribute("aria-expanded", "false"); }
$("#folderBtn").onclick = (e) => { e.stopPropagation(); const m = $("#folderMenu"); const open = m.hidden; closeMenus(); m.hidden = !open; $("#folderBtn").setAttribute("aria-expanded", String(open)); };
$("#changeFolder").onclick = openFolder;
$("#pill").onclick = (e) => { e.stopPropagation(); if (S.status !== "snapshot") return; const m = $("#pillMenu"); const open = m.hidden; closeMenus(); m.hidden = !open; };
$("#pillOpen").onclick = openFolder;
document.addEventListener("click", (e) => { if (!e.target.closest(".menu")) closeMenus(); });

const THEMES = ["system", "light", "dark"];
// Same icons and labels as the site's #themeBtn (site/index.html). "system" is shown as "auto".
const THEME_ICON = {
  system: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>',
  light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  dark: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>' };
const THEME_LABEL = { system: "Theme: auto (follows your system). Switch to light", light: "Theme: light. Switch to dark", dark: "Theme: dark. Switch to auto" };
let theme = store.get("eleven-theme") || "system";
function applyTheme(t, save = true) {
  theme = THEMES.includes(t) ? t : "system";
  if (theme === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  $("#themeBtn").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + THEME_ICON[theme] + "</svg>";
  $("#themeBtn").setAttribute("aria-label", THEME_LABEL[theme]);
  $("#themeBtn").title = THEME_LABEL[theme];
  if (save) store.set("eleven-theme", theme === "system" ? null : theme);
}
$("#themeBtn").onclick = () => applyTheme(THEMES[(THEMES.indexOf(theme) + 1) % 3]);

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeMenus();
    if (document.body.classList.contains("drawer")) return setDrawer(false);
    if ($("#framebox.full")) return setFull(false);
    if (S.graphOpen) return setGraph(false);
    return;
  }
  const t = e.target;
  if (e.metaKey || e.ctrlKey || e.altKey || !S.source || S.noLedger) return;
  if (t.closest && t.closest("input, textarea, select, [contenteditable], iframe")) return;
  if (e.key === "g") setGraph(!S.graphOpen);
  else if (e.key === "h") navigate("home", null, { closeGraph: true });
});
let lastWide = isWide();
addEventListener("resize", () => {
  if (!isPhone()) setDrawer(false);
  if (isWide() !== lastWide) { lastWide = isWide(); if (S.model) layoutPanes(); }
  if (S.graphOpen && S.model) { cancelAnimationFrame(G.raf); G.raf = requestAnimationFrame(() => renderGraph()); }
});

// ---------------------------------------------------------------- test output (harness only)
function testOut() {
  if (!window.__ELEVEN_TEST_FILES__ || !S.model) return;
  let el = document.getElementById("__eleven_test_out");
  if (!el) { el = document.createElement("script"); el.type = "application/json"; el.id = "__eleven_test_out"; document.body.appendChild(el); }
  const wm = workModel();
  el.textContent = JSON.stringify({
    items: S.model.items.map((i) => ({ id: i.id, state: i.state, chip: i.chip, sentence: i.sentence, round: i.round, warn: i.warn, questions: i.questionsCount, questionsShown: i.state === "waiting" && !!i.questionsMd })),
    workGraph: {
      project: wm.project.title,
      items: wm.items.map(({ it, tasks, files }) => ({ id: it.id, state: it.state, collapsed: G.collapsed.has(it.id),
        tasks: tasks.map((t) => `#${t.n} ${t.role} [${t.kind}] -> ${t.outs.map((p) => fileLabel(p) + ((wm.producers.get(p) || [])[0] !== t.key ? " (also)" : "")).join(", ") || "-"}`),
        itemFiles: files.map(fileLabel) })),
      decisionsLeft: wm.decisionsLeft,
      drawn: G.L ? { mode: G.mode, nodes: G.L.nodes.length + G.L.nodes.filter((n) => n.chips).reduce((s, n) => s + n.chips.length, 0), edges: G.edgeEls?.length ?? 0, faint: G.L.edges.filter((e) => e.faint).length } : null,
    },
  });
}

// ---------------------------------------------------------------- boot
try { S.openDirs = new Set(JSON.parse(store.get("eleven-open") || "[]")); } catch { S.openDirs = new Set(); }
(async function boot() {
  const h = readHash();
  applyTheme(h.theme && THEMES.includes(h.theme) ? h.theme : theme, !h.theme);
  if (h.file) { S.view = { kind: "file", path: h.file }; }
  if (h.graph) S.graphOpen = true;
  if (h.q === true) S.openQAll = true;            // #q opens every questions disclosure (harmless deep link)
  else if (h.q) S.openQ = new Set(String(h.q).split(","));
  S.hashAnchor = h.at || null;
  if (window.__ELEVEN_TEST_FILES__) {
    startSource(testSource());
    await new Promise((r) => setTimeout(r, 0));
  } else if ("showDirectoryPicker" in window) {
    let rec = await loadHandle();
    if (rec && !rec.h) {   // old format: a bare handle that may be the whole project (M3). Keep only its eleven/ part.
      let perm = "prompt";
      try { perm = await rec.queryPermission({ mode: "read" }); } catch {}
      await dropHandle();
      if (perm !== "granted") rec = null;
      else { const { root, name } = await fsaRoot(rec); S.saved = { h: root, name }; return startSource(fsaSource(root, name, S.saved)); }
    }
    S.saved = rec;
    if (rec) {
      let perm = "prompt";
      try { perm = await rec.h.queryPermission({ mode: "read" }); } catch {}
      if (perm === "granted") return startSource(fsaSource(rec.h, rec.name));
    }
    renderConnect();
  } else renderConnect();
})();
